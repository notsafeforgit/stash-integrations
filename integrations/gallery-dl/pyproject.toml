[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stash-ingest"
version = "0.6.53"
description = "Durable gallery-dl producer for the native Stash ingestion API"
requires-python = ">=3.12"

[project.optional-dependencies]
gallery = [
  "gallery-dl @ git+https://codeberg.org/mikf/gallery-dl.git@c3249c9f0d7bda3e097262389e0c1c4bb42d7181",
  "yt-dlp[curl-cffi] @ git+https://github.com/yt-dlp/yt-dlp.git@897341241f2bfb2439fe0367f4c7c9ccd29a3828",
]

[project.scripts]
stash-gallery = "stash_gallery:main"
stash-ingest = "stash_ingest_bootstrap:main"
stash-gallery-dl = "stash_ingest.manual:main"
stash-ingest-config = "stash_ingest.config_migration:main"
stash-ingest-storage = "stash_ingest.storage:main"
stash-outbox-retention = "stash_ingest.outbox_history:main"
stash-ingest-twitter = "stash_ingest.launchers:twitter_main"
stash-ingest-reddit = "stash_ingest.launchers:reddit_main"
stash-ingest-redgifs = "stash_ingest.launchers:redgifs_main"
stash-ingest-instagram = "stash_ingest.launchers:instagram_main"
stash-ingest-coomer = "stash_ingest.launchers:coomer_main"
stash-ingest-kemono = "stash_ingest.launchers:kemono_main"
stash-ingest-bluesky = "stash_ingest.launchers:bluesky_main"
stash-ingest-tiktok = "stash_ingest.launchers:tiktok_main"
stash-import-backfills = "stash_ingest.backfill_import:main"
stash-ingest-n8n = "stash_ingest.n8n_runner:main"
stash-ingest-n8n-config = "stash_ingest.n8n_migration:main"
stash-manage-sources = "stash_ingest.source_management:main"
stash-n8n-parent-alive = "stash_ingest.n8n_parent_alive:main"
stash-n8n-sources = "stash_ingest.n8n_sources:main"
stash-import-n8n-receipts = "stash_ingest.n8n_receipt_import:main"
stash-import-scan-journal = "stash_ingest.scan_journal_import:main"
stash-activate-scan-journal = "stash_ingest.scan_activation:main"
stash-backfill-source-albums = "stash_ingest.album_backfill:main"
stash-backfill-post-media = "stash_ingest.post_media_backfill:main"
stash-dedupe = "stash_ingest.dedupe:main"
stash-dedupe-host = "stash_ingest.dedupe_host:main"
stash-intake-folders = "stash_ingest.intake_folder:main"

[tool.setuptools]
py-modules = ["stash_ingest_bootstrap", "stash_gallery"]

[tool.setuptools.packages.find]
where = ["src"]
